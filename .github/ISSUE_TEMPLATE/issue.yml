name: 🐛 Bug report
description: Report a problem with tgforwarder
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, source/dest used, flags, etc.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste the tgf output. REDACT any channel IDs / usernames you consider private.
  - type: checkboxes
    id: secrets
    attributes:
      label: Safety check
      options:
        - label: I have NOT pasted API id/hash or session files
          required: true
---
name: ✨ Feature request
description: Suggest an improvement to tgforwarder
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
---
name: ❓ Question / discussion
description: Ask how something works or discuss usage
labels: [question]
body:
  - type: textarea
    id: q
    attributes:
      label: Your question
    validations:
      required: true
