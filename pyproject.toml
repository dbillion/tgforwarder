[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgforwarder"
version = "0.2.1"
description = "Telegram MTProto media-forwarder with OCR + local-first SQLite cache and chat usefulness scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "oludayo" }]
keywords = ["telegram", "telethon", "mtproto", "ocr", "forwarder", "cli", "scraper"]
dependencies = [
    "telethon>=1.36",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pytesseract>=0.3",
    "pillow>=10.0",
    "pdf2image>=1.16",
    "opencv-python-headless>=4.8",
    "docx2txt>=0.8",
    "kreuzberg>=4.0",  # Rust-backed OCR/text extraction (fast path)
    "humanize>=4.0",
    "numpy>=1.24",
]

[project.scripts]
tgf = "tgforwarder.cli:cli"

[project.urls]
Homepage = "https://github.com/dbillion/tgforwarder"

[tool.setuptools.packages.find]
include = ["tgforwarder*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
